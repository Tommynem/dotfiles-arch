# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2

# Triple 27" Philips 27M2N3800A 4K monitors (3840x2160 @ 160Hz, 1.5 scale)
# Effective width per monitor: 3840/1.5 = 2560px
# Using serial numbers in description for stable identification

# Left monitor (serial UK02523029225)
monitor = desc:Philips Consumer Electronics Company 27M2N3800A UK02523029225, 3840x2160@160, 0x0, 1.5

# Center monitor (serial UK02523029221)
monitor = desc:Philips Consumer Electronics Company 27M2N3800A UK02523029221, 3840x2160@160, 2560x0, 1.5

# Right monitor (serial UK02523029213)
monitor = desc:Philips Consumer Electronics Company 27M2N3800A UK02523029213, 3840x2160@160, 5120x0, 1.5

# Fallback for any other monitors
monitor = , preferred, auto, 1.5
