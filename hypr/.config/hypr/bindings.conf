# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, $terminal -e yazi
bindd = SUPER ALT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Secondary browser, exec, setsid uwsm-app -- chromium
bindd = SUPER, N, neovide, exec, omarchy-launch-or-focus neovide
bindd = SUPER SHIFT, N, nvim, exec, omarchy-launch-editor
bindd = SUPER ALT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER ALT, L, Lazygit, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)" -e lazygit
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER ALT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER ALT, M, Email, exec, omarchy-launch-or-focus "thunderbird"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, M, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, G, Github, exec, omarchy-launch-or-focus-webapp WhatsApp "https://github.com"

# System utilities - Screenshots/Captures (60% keyboard friendly)
# Replaced Print key bindings with Super + P variants for 60% keyboard compatibility
unbind = SUPER, P
bindd = SUPER, P, Screenshot with editing, exec, omarchy-capture-screenshot
bindd = SUPER SHIFT, P, Screenshot to clipboard, exec, omarchy-capture-screenshot smart copy
bindd = SUPER ALT, P, Screen recording, exec, omarchy-menu screenrecord
bindd = SUPER CTRL, P, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Legacy screenshot binding (keeping for transition period)
bindd = SUPER SHIFT, S, screenshot snip (legacy), exec, omarchy-capture-screenshot

# Close window operations (improved for consistency)
bindd = SUPER, Q, Close window, killactive,
bindd = SUPER SHIFT, Q, Close all windows, exec, omarchy-hyprland-window-close-all

unbind = SUPER, T
bindd = SUPER SHIFT, F, Toggle floating window, togglefloating

# Move workspaces between monitors with SUPER ALT + arrows
bindd = SUPER ALT, left, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER ALT, right, Move workspace to right monitor, movecurrentworkspacetomonitor, r
